name: Publish package on release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install deps
        run: npm install

      - name: Validate package
        run: npm run ci

      - name: Align package version with release tag
        run: |
          TARGET_VERSION="${{ github.event.release.tag_name }}"
          TARGET_VERSION="${TARGET_VERSION#v}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Version already aligned: $CURRENT_VERSION"
          else
            npm version "$TARGET_VERSION" --no-git-tag-version
          fi

      # NPM_TOKEN : un jeton « automation » npmjs, à poser dans les secrets du
      # repo. Le publishConfig du package fixe déjà le registre et l'accès public.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
