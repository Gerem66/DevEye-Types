name: Publish package on release

on:
  release:
    types: [published]

permissions:
  contents: read
  # Trusted publishing (OIDC) : npmjs fait confiance à CE workflow de CE repo,
  # aucun jeton à stocker. Le jeton d'identité est émis à la volée par GitHub.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Le npm livré avec Node 22 est un 10.x : l'échange OIDC exige npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      - name: Install deps
        run: npm install

      - name: Validate package
        run: npm run ci

      - name: Align package version with release tag
        run: |
          TARGET_VERSION="${{ github.event.release.tag_name }}"
          TARGET_VERSION="${TARGET_VERSION#v}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"

          if [ "$CURRENT_VERSION" = "$TARGET_VERSION" ]; then
            echo "Version already aligned: $CURRENT_VERSION"
          else
            npm version "$TARGET_VERSION" --no-git-tag-version
          fi

      # Registre et accès public viennent du publishConfig du package.
      # `--provenance=false` tant que le dépôt est privé : npm ne peut attester
      # que la source d'un dépôt public. À retirer le jour où il passe public,
      # l'attestation sera alors générée d'office.
      - name: Publish to npm (trusted publishing)
        run: npm publish --provenance=false
